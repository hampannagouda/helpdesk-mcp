<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk MCP Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Main Board -->
        <main class="dashboard">
            <header class="top-nav">
                <div class="logo">
                    <span class="icon">✨</span>
                    <h1>Help Desk <span>MCP</span></h1>
                </div>
                <button id="btn-new-ticket" class="btn-primary">+ New Ticket</button>
            </header>

            <section class="board" id="ticket-board">
                <!-- Tickets will be dynamically injected here -->
            </section>
        </main>

        <!-- AI Chat Sidebar -->
        <aside class="ai-sidebar">
            <div class="chat-header">
                <h2>🤖 Support Agent</h2>
                <p>Powered by MCP</p>
            </div>
            <div class="chat-history" id="chat-history">
                <div class="chat-bubble ai">
                    Hello! I'm your AI Help Desk Agent. How can I assist you today?
                </div>
            </div>
            <form id="chat-form" class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type your request... (e.g. 'My laptop is broken')" required autocomplete="off">
                <button type="submit" class="btn-send">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </form>
        </aside>
    </div>

    <!-- Manual Ticket Modal -->
    <div class="modal-overlay" id="ticket-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Create Ticket</h2>
                <button class="close-btn" id="btn-close-modal">✕</button>
            </div>
            <form id="ticket-form">
                <div class="form-group">
                    <label for="title">Issue Description</label>
                    <input type="text" id="title" required placeholder="What seems to be the problem?">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Unassigned" selected>Unassigned</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status">
                            <option value="Open" selected>Open</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Resolved">Resolved</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-primary full-width">Submit Ticket</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
